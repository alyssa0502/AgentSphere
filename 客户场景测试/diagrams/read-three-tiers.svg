<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">524MB 文件读速度三层（沙箱内 cat 打点）</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">条宽为示意，标注为实测值 · 模板 53319a80（镜像 20261105c）</text>

  <!-- L1 -->
  <text x="40" y="128" font-size="15" font-weight="bold" fill="#b91c1c">L1 真冷读</text>
  <text x="40" y="150" font-size="12" fill="#64748b">数据块从未落到宿主盘</text>
  <rect x="200" y="106" width="560" height="46" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="212" y="135" font-size="15" font-weight="bold" fill="#7f1d1d">46.0s · 11 MB/s</text>
  <text x="772" y="135" font-size="12" fill="#7f1d1d">客户对照：41.7s · 7MB/s ✅</text>
  <text x="200" y="170" font-size="12" fill="#64748b">每个新镜像层只发生一次（首次物化）</text>

  <!-- L2a -->
  <text x="40" y="228" font-size="15" font-weight="bold" fill="#b45309">L2a 盘读·慢径</text>
  <text x="40" y="250" font-size="12" fill="#64748b">已物化，传导初期</text>
  <rect x="200" y="206" width="270" height="46" rx="6" fill="#fed7aa" stroke="#d97706" stroke-width="1.5"/>
  <text x="212" y="235" font-size="15" font-weight="bold" fill="#7c2d12">7.4s · 71 MB/s</text>
  <text x="484" y="235" font-size="12" fill="#7c2d12">客户隔夜 3.08s/301MB 同量级</text>
  <text x="200" y="270" font-size="12" fill="#64748b">残留概率 ~4%（50 台中 2 台）</text>

  <!-- L2b -->
  <text x="40" y="322" font-size="15" font-weight="bold" fill="#047857">L2b 盘读·快径</text>
  <text x="40" y="344" font-size="12" fill="#64748b">传导完成（≈30 分钟）</text>
  <rect x="200" y="300" width="170" height="46" rx="6" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="212" y="329" font-size="15" font-weight="bold" fill="#064e3b">2.4s · 210 MB/s</text>
  <text x="384" y="329" font-size="12" fill="#064e3b">50 台 p50 · 端到端 p50 5.1s</text>
  <text x="200" y="364" font-size="12" fill="#64748b">每个新沙箱首读都要重走盘层（跨沙箱无共享页缓存）</text>

  <!-- L3a -->
  <text x="40" y="416" font-size="15" font-weight="bold" fill="#1d4ed8">L3a 同沙箱二读</text>
  <text x="40" y="438" font-size="12" fill="#64748b">页缓存部分留存</text>
  <rect x="200" y="394" width="110" height="46" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="212" y="423" font-size="15" font-weight="bold" fill="#1e3a8a">1.0s · ~500MB/s</text>
  <text x="324" y="423" font-size="12" fill="#1e3a8a">500MB 未被页缓存全量留住</text>

  <!-- L3b -->
  <text x="40" y="492" font-size="15" font-weight="bold" fill="#6d28d9">L3b 页缓存·boot 路径</text>
  <text x="40" y="514" font-size="12" fill="#64748b">热池预热自读</text>
  <rect x="200" y="470" width="60" height="46" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="212" y="499" font-size="15" font-weight="bold" fill="#4c1d95">0.02s</text>
  <text x="274" y="499" font-size="12" fill="#4c1d95">chromium 297MB（开机即自读，永远热）</text>

  <!-- 底注 -->
  <line x1="40" y1="544" x2="920" y2="544" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="570" font-size="13" fill="#334155">沙箱拉起（热池）恒定 ~1s，与读速度无关 —— 端到端时长被首读层支配：L1→49.2s，L2b→5.1s</text>
  <text x="40" y="590" font-size="12" fill="#64748b">判读口径（500MB）：&gt;20s 真冷读 · 2-20s 盘读 · &lt;2s 页缓存/快径</text>
</svg>
